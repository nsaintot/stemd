# Build the prebuilt MLX that the Linux and Windows packages link, and attach
# it to the release named in packaging/mlx-prebuilt.env. Start it by pushing
# that tag (mlx-cuda-<n>), or by hand.
#
# Compiling the CUDA kernels can outlast a runner's 6 h job limit. The compile
# goes through ccache, and the cache is saved even when the build is stopped,
# so re-running the failed jobs continues where they stopped. Three caches of
# 3 GB stay inside the repository's 10 GB cache quota.
#
# Afterwards, copy the SHA-256 lines from the run summary into
# packaging/mlx-prebuilt.env.
name: MLX prebuilt

on:
  push:
    tags: ["mlx-cuda-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: MLX (linux ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04, platform: linux/amd64 }
          - { arch: aarch64, runner: ubuntu-24.04-arm, platform: linux/arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Free disk space
        run: .github/scripts/free-disk.sh
      - name: Build image
        run: docker build --platform ${{ matrix.platform }} -t stemd-linux packaging/linux
      - id: key
        run: |
          . packaging/mlx-prebuilt.env
          echo "key=ccache-linux-${{ matrix.arch }}-$MLX_PREBUILT_TAG-$(sha256sum packaging/linux/Dockerfile packaging/mlx-prebuilt.env vendor/mlx-rs-stemd/mlx-sys/build.rs | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ steps.key.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          # ccache checks every hit itself, so any cache for this arch is safe.
          restore-keys: |
            ${{ steps.key.outputs.key }}-
            ccache-linux-${{ matrix.arch }}-
      # Stopped by `timeout` with time left to save the cache.
      - name: Build MLX
        id: build
        continue-on-error: true
        run: |
          mkdir -p .ccache dist
          timeout --signal=TERM -k 2m 300m docker run --rm --init --name mlx -v "$PWD:/work" \
              -e CCACHE_DIR=/work/.ccache -e CCACHE_MAXSIZE=3G \
              -e CMAKE_CUDA_COMPILER_LAUNCHER=ccache -e CMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -e CMAKE_BUILD_PARALLEL_LEVEL=3 -e CARGO_BUILD_JOBS=3 \
              stemd-linux "packaging/prebuilt.sh build /work/dist && ccache -s"
      - name: Own the cache
        if: always()
        run: |
          docker rm -f mlx >/dev/null 2>&1 || true
          sudo chown -R "$(id -u):$(id -g)" .ccache dist
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .ccache
          key: ${{ steps.key.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Stop if unfinished
        if: steps.build.outcome != 'success'
        run: |
          echo "::error::The build stopped before it finished. Re-run the failed jobs to continue from the cache."
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: mlx-linux-${{ matrix.arch }}
          path: dist/mlx-cuda-linux-*.tar.zst
          compression-level: 0

  windows:
    name: MLX (windows x86_64)
    runs-on: windows-2022
    timeout-minutes: 355
    env:
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_MAXSIZE: 3G
      # Short, because MLX's dependencies nest deep under OUT_DIR.
      CARGO_TARGET_DIR: C:\t
      # MSVC rejects the Hopper quantized matmul kernels (error C2719 on an
      # over-aligned parameter). Hopper GPUs use the sm80 kernels instead.
      MLX_DISABLE_SM90A_KERNELS: 1
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      # No developer prompt: cmake-rs finds MSVC itself, and Git Bash's own
      # link.exe would shadow MSVC's on PATH.
      - name: Install CUDA
        run: .github/scripts/windows-cuda.ps1
      - name: Install Ninja and ccache
        run: .github/scripts/windows-tools.ps1
      - id: key
        shell: bash
        run: |
          . packaging/mlx-prebuilt.env
          echo "key=ccache-windows-x86_64-$MLX_PREBUILT_TAG-$(sha256sum .github/scripts/windows-cuda.ps1 packaging/mlx-prebuilt.env vendor/mlx-rs-stemd/mlx-sys/build.rs | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ steps.key.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.key.outputs.key }}-
            ccache-windows-x86_64-
      # Stopped by the step timeout with time left to save the cache.
      - name: Build MLX
        id: build
        continue-on-error: true
        timeout-minutes: 300
        shell: bash
        env:
          CMAKE_CUDA_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CMAKE_BUILD_PARALLEL_LEVEL: 3
          CARGO_BUILD_JOBS: 3
        run: packaging/prebuilt.sh build dist
      - name: Cache statistics
        if: always()
        run: ccache -s
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .ccache
          key: ${{ steps.key.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Stop if unfinished
        if: steps.build.outcome != 'success'
        run: |
          echo "::error::The build stopped before it finished. Re-run the failed jobs to continue from the cache."
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: mlx-windows-x86_64
          path: dist/mlx-cuda-windows-*.zip
          compression-level: 0

  publish:
    name: Attach to the release
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: packaging/mlx-prebuilt.env
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          pattern: mlx-*
          path: dist
          merge-multiple: true
      - run: |
          . packaging/mlx-prebuilt.env
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$MLX_PREBUILT_TAG" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match MLX_PREBUILT_TAG=$MLX_PREBUILT_TAG"
              exit 1
          fi
          if ! gh release view "$MLX_PREBUILT_TAG" >/dev/null 2>&1; then
              gh release create "$MLX_PREBUILT_TAG" --prerelease --target "$GITHUB_SHA" \
                  --title "Prebuilt MLX ($MLX_PREBUILT_TAG)" \
                  --notes "MLX built with CUDA for the Linux and Windows packages. Not for end users. See packaging/mlx-prebuilt.env."
          fi
          gh release upload "$MLX_PREBUILT_TAG" --clobber dist/mlx-cuda-*
          {
              echo '```'
              for f in dist/mlx-cuda-*; do
                  platform="${f#dist/mlx-cuda-}"; platform="${platform%%.*}"
                  echo "SHA256_${platform//-/_}=$(sha256sum "$f" | cut -d' ' -f1)"
              done
              echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
