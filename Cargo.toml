[workspace]
resolver = "3"
# The vendored MLX fork is reached through [patch.crates-io] below and is not a
# member. Cargo claims every crate inside the workspace directory unless told
# otherwise; without this exclusion the build stops and reports the crates as
# unlisted.
exclude = ["vendor"]
members = [
    "crates/stemd-audio",
    "crates/stemd-core",
    "crates/stemd-mlx",
    "crates/stemd-server",
    "crates/stemd-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
# 1.89 for `File::try_lock`, which keeps a second server off a cache in use.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nsaintot/stemd"
readme = "README.md"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

# MLX, forked to build on platforms other than Apple silicon. `mlx-sys` 0.2.0
# emits Apple-only link directives and bundles an mlx-c with no CUDA backend and
# no x86 half type. 0.25.3 and 0.2.0 are the newest published versions of the
# two crates, and neither has a `cuda` feature, so no upgrade fixes this. See
# vendor/mlx-rs-stemd.
#
# A clone needs `--recurse-submodules`, or `git submodule update --init`
# afterwards; without it these paths do not exist and cargo reports that.
[patch.crates-io]
mlx-sys = { path = "vendor/mlx-rs-stemd/mlx-sys" }
mlx-rs = { path = "vendor/mlx-rs-stemd/mlx-rs" }
