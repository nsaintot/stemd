[package]
name = "stemd-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Audio file decoding shared by the stemd server and client."

# No stemd-core dependency, so the command-line client builds without MLX.
[dependencies]
anyhow.workspace = true
symphonia = { version = "0.5", features = ["mp3", "flac", "aac", "isomp4", "aiff"] }
flacenc = { version = "0.5.1", default-features = false, features = ["log", "par"] }
