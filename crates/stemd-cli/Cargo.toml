[package]
name = "stemd-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Command-line client for a stemd server."

[dependencies]
anyhow.workspace = true
clap = { version = "4.6.6", features = ["derive"] }
flacenc = { version = "0.5.1", default-features = false, features = ["log", "par"] }
hound = "3.5.1"
mdns-sd = "0.20.3"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
# No stemd-core dependency: the client needs only HTTP and audio I/O, and reads
# stem names from /v2/health. stemd-core would pull in MLX, which this crate
# never calls.
stemd-audio = { path = "../stemd-audio" }
ureq = "3.4.0"
