[package]
name = "stemd-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Stem separation pipeline: PCM in, stems out, demucs v4 and BS-RoFormer on MLX."

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# Errors returned to HTTP callers must name the bad input precisely.
thiserror.workspace = true
tracing.workspace = true
# The model. mlx-rs is a direct dependency too because this crate marshals
# audio into and out of its arrays.
stemd-mlx = { path = "../stemd-mlx" }
# 16-bit quantisation and the FLAC encoder, shared with the CLI.
stemd-audio = { path = "../stemd-audio" }
mlx-rs = { version = "0.25", features = ["metal", "safetensors"] }
flacenc = { version = "0.5.1", default-features = false, features = ["log", "par"] }
rubato = "5.0.0"
mp3lame-encoder = "0.2.4"

[features]
# A small model with no weights, for testing what drives a separator.
toy = []
# The RoFormer-and-demucs hybrid and the chained halves, reached only from the research tests.
research = []

[dev-dependencies]
# A decoder from another project, so the FLAC round-trip test cannot share a
# misreading of the format with the encoder.
claxon = "0.4.3"
# # An independent mp3 decoder, for the same reason: an encoder quality level is
# a claim about how the output sounds, and it must be measured through another
# decoder.
symphonia = { version = "0.5", features = ["mp3"] }
