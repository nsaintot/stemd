[package]
name = "stemd-mlx"
version.workspace = true
edition.workspace = true
license.workspace = true

# The demucs v4 and BS-RoFormer graphs on MLX. It does not depend on stemd-core: it is a
# model, and keeping it standalone means its tests need only the weights.
[dependencies]
mlx-rs = { version = "0.25", features = ["metal", "safetensors"] }
# For the allocator controls in `memory`, which mlx-rs neither wraps nor
# re-exports. It resolves through the same [patch.crates-io] as mlx-rs, so both
# halves of the stack stay on the vendored fork.
mlx-sys = "0.2"
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
