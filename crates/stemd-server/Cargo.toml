[package]
name = "stemd-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Host-side stem separation service: HTTP, mDNS discovery and a content-addressed stem cache."

[dependencies]
stemd-core = { path = "../stemd-core" }
stemd-audio = { path = "../stemd-audio" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
http-body-util = "0.1.4"
tower-http = { version = "0.7.0", features = ["trace"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.6", features = ["derive"] }
tokio-util = { version = "0.7.19", features = ["io"] }
parking_lot = "0.12.5"
thiserror.workspace = true
# `persistence` saves the window's position and size between launches.
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts", "persistence"] }
if-addrs = "0.15.0"
# First-run model download: HTTP plus a pinned digest.
ureq = "3.4.0"
sha2 = "0.10"
# The per-platform cache and data directories. See `cache::default_dir`.
dirs = "6"

[dev-dependencies]
stemd-core = { path = "../stemd-core", features = ["toy"] }
tower = { version = "0.5.3", features = ["util"] }

# winit is eframe's window layer. It is named here for one call, which asks for
# the X11 backend, the only one of winit's three that implements file drag and
# drop. See `ui::run`.
[target.'cfg(windows)'.build-dependencies]
# Only used when the host is Windows, where the icon is wanted and the resource
# compiler exists.
winresource = "0.1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["x11"] }

# Unpacks NVIDIA's redistributable archives, the only zip files the server
# reads. `default-features = false` leaves out bzip2, zstd, lzma and encryption:
# these archives are deflate, and the other formats would add attack surface for
# files read from one host. Windows only, because only there is CUDA downloaded
# at run time. See `cuda`.
[target.'cfg(windows)'.dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
# Free disk space (see `disk.rs`); ShellExecuteW starts the updater's Setup; the
# registry gives the install mode, and the token says whether the process can
# elevate.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Sparkle, through the Objective-C runtime. See `update::sparkle`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSString"] }

[target.'cfg(unix)'.dependencies]
# statvfs and sysctl; see `disk.rs`.
libc = "0.2"

# `default-features = false` above keeps wgpu and accesskit out, but it also
# drops `x11` and `wayland`, which winit needs: without one of them it has no
# Linux backend and stops the build with "the platform you're compiling for is
# not supported". Both are enabled because a session may use either, and winit
# picks at run time. macOS and Windows have a single backend outside any
# feature, so this stays off their dependency graph.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.35.0", default-features = false, features = [
    "glow",
    "default_fonts",
    "persistence",
    "x11",
    "wayland",
] }

