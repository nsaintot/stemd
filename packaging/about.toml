# cargo-about configuration for packaging/THIRD-PARTY-CRATES.
# scripts/crate-notices.sh runs it; see docs/building.md.

# Licences a shipped crate may use. For a crate under several, such as
# "MIT OR Apache-2.0", the notices name the first one listed here.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-3.0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Zlib",
]

# Every platform a package is built for, so a crate used on one platform only
# is listed too.
targets = [
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

# Only what is compiled into the binaries.
ignore-dev-dependencies = true
ignore-build-dependencies = true
